# ---------------------------------------------------------------------------
#  attic_manifest.yaml: the curated evacuation list.
#
#  Read by tools/attic.py. Every path here is MOVED to _ATTIC/<bucket>/, never
#  deleted, and recorded in _ATTIC/MANIFEST.csv so `attic.py restore <path>`
#  puts it back.
#
#  Adding a path here is a decision that it is not part of the running system.
#  The reason field is the evidence for that decision, so keep it specific enough
#  that a future reader can check it.
#
#  NOT in this file, deliberately:
#    FeatureTemplates/           1,681 candidate blocks, left in place by choice
#    experimental/canbuy_flow, _rollback, canbuy_groundup, _backups, tests
#                               touched since 2026-08-14 and referenced
#    experimental/backtesters/5v2__NightlyBackTester_CanBuyV2.py
#                               11 real referencing files
#    auxiliary/0__ApproximateMarketCaps.py, build_beta_lookup.py,
#    build_market_state.py      silent producers of parquets live code reads
#    Data/_backups/ (the dir)   live, written by 7__MacroFilter.py:1003
#    analysis_output/ (the dir) live, trading_system.ps1:448 writes the drift log
# ---------------------------------------------------------------------------

